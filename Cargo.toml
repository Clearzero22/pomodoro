[workspace]
resolver = "2"
    members = [
    "crates/pomodoro",
    "crates/pomodoro-desktop",
    "crates/pomodoro-web",
    "server",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
# The application layer. `gpui-kit` is the only dependency an application needs;
# it pins the matching GPUI snapshot and re-exports GPUI, base, component and assets.
gpui-kit = { path = "../gpui-kit/crates/kit" }
# The shared business logic, compiled into both the desktop and the web entry point.
pomodoro = { path = "crates/pomodoro" }
# `std::time::Instant::now()` panics with "time not implemented on this platform"
# on wasm32-unknown-unknown. `instant` is the same clock backed by
# `performance.now()` there and by std elsewhere, so the timer code can be
# written once. GPUI Kit's own layers depend on it for the same reason.
instant = { version = "0.1", features = ["wasm-bindgen"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.4", features = ["v4", "serde", "js"] }
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde", "wasm-bindgen"] }
thiserror = "1.0"

# Release 构建的参数。WASM 产物要发到浏览器和手机上，体积直接影响首屏速度，
# 所以这里比 Cargo 默认更激进：体积优先（opt-level = "z"）、开 LTO、
# 单编译单元（利于跨 crate 内联与去重）。
#
# `panic = "abort"` 在这里收益有限却会改变行为（无法 catch_unwind），
# 因此不启用，保持与桌面端一致的语义。
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
panic = "unwind"
