[package]
name = "pomodoro-web"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
gpui-kit = { workspace = true }
pomodoro = { workspace = true }

# The browser boundary: panic messages and logs go to the developer console.
console_error_panic_hook = "0.1"
console_log = "1.0"
log = "0.4"
tracing-wasm = "0.2"
wasm-bindgen = "0.2"
