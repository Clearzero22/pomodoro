<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#18181b" />
    <!-- 可安装：安卓 Chrome 触发“添加到主屏幕”，iOS Safari 触发“添加到主屏幕”后以 standalone 启动。 -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="番茄钟" />
    <title>番茄钟</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        --loading-bg: #fff;
        --loading-fg: #000;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC',
          'Microsoft YaHei', sans-serif;
        overflow: hidden;
        width: 100vw;
        height: 100vh;
        background: var(--loading-bg);
        color: var(--loading-fg);
      }

      /* GPUI 在 body 下挂一个 canvas，自己画每一帧。 */
      body > canvas {
        position: fixed;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
      }

      #loading {
        position: fixed;
        z-index: 1;
        pointer-events: none;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
        /* 全面屏手机的安全区，避免文字被刘海或圆角裁掉。 */
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom)
          env(safe-area-inset-left);
      }

      .spinner {
        border: 4px solid color-mix(in srgb, var(--loading-fg) 10%, transparent);
        border-left-color: var(--loading-fg);
        border-radius: 50%;
        width: 40px;
        height: 40px;
        animation: spin 1s linear infinite;
        margin: 0 auto 16px;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .error {
        color: #d32f2f;
        padding: 20px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div id="loading">
      <div class="spinner"></div>
      <p>正在启动番茄钟…</p>
    </div>
    <script type="module" src="/src/main.js"></script>
    <script type="module">
      // 只在生产构建的浏览器 PWA 里注册 Service Worker。
      // 原生壳（Capacitor）不注册：APK 里的资源本身就是本地的，
      // 注册只会让新版本被旧缓存挡住——缓存里的 index.html 引用的是上一版
      // 带哈希的 JS，而新 APK 里已经没有那个文件，于是永远停在启动页。
      // 开发期也不注册，否则 Vite 热更新会拿到旧缓存。
      const nativeShell = Boolean(globalThis.Capacitor?.isNativePlatform?.());
      if ('serviceWorker' in navigator && import.meta.env.PROD && !nativeShell) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').catch((error) => {
            console.warn('Service worker registration failed:', error);
          });
        });
      }
    </script>
  </body>
</html>
